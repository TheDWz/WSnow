name: Android build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.WSNOW_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "WSNOW_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Test and build
        env:
          WSNOW_KEYSTORE_PASSWORD: ${{ secrets.WSNOW_KEYSTORE_PASSWORD }}
          WSNOW_KEY_ALIAS: ${{ secrets.WSNOW_KEY_ALIAS }}
          WSNOW_KEY_PASSWORD: ${{ secrets.WSNOW_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :engine:test :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk WSnow.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WSnow-apk
          path: WSnow.apk

      - name: Publish release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: WSnow build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          make_latest: ${{ github.ref == 'refs/heads/main' }}
          files: WSnow.apk
          body: |
            Download **WSnow.apk** on your Android phone and open it to install.
            Built from `${{ github.ref_name }}` at ${{ github.sha }}.
